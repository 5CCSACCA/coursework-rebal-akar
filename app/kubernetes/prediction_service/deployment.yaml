apiVersion: apps/v1
kind: Deployment
metadata:
  name: prediction-service
  namespace: hatespeech
spec:
  replicas: 2
  selector:
    matchLabels:
      app: prediction-service
  template:
    metadata:
      labels:
        app: prediction-service
    spec:
      containers:
      - name: prediction-service
        image: prediction-service:latest
        imagePullPolicy: Never

        ports:
        - containerPort: 8000
        env:
        - name: MONGODB_URL
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: mongodb-url
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: secret-key
        - name: DATABASE_NAME
          value: "hatespeech_db"
        - name: ALGORITHM
          value: "HS256"
        - name: TOKEN_URL
          value: "http://auth-service:8000/users/login"
        resources:
          requests:
            cpu: "200m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"

apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: hatespeech
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
      annotations:
        prometheus.io/scrape: "true"       
        prometheus.io/path: "/auth/metrics"      
        prometheus.io/port: "8000"  
    spec:
      containers:
      - name: auth-service
        image: auth-service:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8000
        env:
        - name: MONGODB_URL
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: mongodb-url
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: secret-key
        - name: DATABASE_NAME
          value: "hatespeech_db"
        - name: ALGORITHM
          value: "HS256"
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "700m"
            memory: "512Mi"
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 20
